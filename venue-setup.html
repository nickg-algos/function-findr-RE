<main class="vs-main">
  <div class="vs-card">
    <h1 id="setup-intro"></h1>
    <form id="setup-form" novalidate>
      <section class="vs-group" aria-labelledby="food-title">
        <h2 id="food-title"><button type="button" class="sec-head vs-group-head" data-section-toggle="food" aria-expanded="true" aria-controls="food-fold">
          <span class="card-title">Food Options:</span>
          <span class="card-sum" data-section-sum="food"></span>
          <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button></h2>
        <div class="fold is-open" id="food-fold"><div class="fold-inner"><div id="food-list"></div></div></div>
      </section>
      <section class="vs-group" aria-labelledby="bev-title">
        <h2 id="bev-title"><button type="button" class="sec-head vs-group-head" data-section-toggle="bev" aria-expanded="true" aria-controls="bev-fold">
          <span class="card-title">Beverage Options:</span>
          <span class="card-sum" data-section-sum="bev"></span>
          <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button></h2>
        <div class="fold is-open" id="bev-fold"><div class="fold-inner"><div id="bev-list"></div></div></div>
      </section>
      <div class="vs-actions">
        <button type="button" class="vs-btn">PREVIEW FUNCTION LISTING</button>
        <button type="button" class="vs-btn is-solid">ADD ANOTHER SPACE <svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <p class="vs-terms"><a href="#">Disclaimer and T&amp;C’s</a></p>
      <p class="save-state" id="save-state" role="status"></p>
