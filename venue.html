<!doctype html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<header class="site-header">
  <a class="logo" href="index.html" aria-label="FunctionFindr home">function<span>findr</span><sup>™</sup></a>

<main class="vp" id="venue"></main>

<section class="band" aria-labelledby="trust-title">
  <div class="band-inner">
    <h2 id="trust-title">Trusted by Melbourne’s top venues</h2>
    <div class="logo-row" id="logos"></div>
  </div>
</section>

<section class="band band-dark" aria-labelledby="reviews-title">
  <div class="band-inner">
    <div class="reviews-head">
      <h2 id="reviews-title">What people say</h2>
      <div class="review-arrows">
        <button type="button" class="review-arrow" data-track="reviews" data-step="-1" aria-label="Previous reviews">←</button>
        <button type="button" class="review-arrow" data-track="reviews" data-step="1" aria-label="Next reviews">→</button>
      </div>
    </div>

  </div>
