<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking calendar | FunctionFindr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="venue-shell.css">
<link rel="stylesheet" href="calendar.css">
</head>
<body>
<div class="cal-shell">
  <aside class="cal-side">
    <div class="cal-side-inner">
      <a class="logo" href="index.html" aria-label="FunctionFindr home">function<span>findr</span><sup>™</sup></a>
      <nav class="cal-nav" aria-label="Venue dashboard">
        <a href="dashboard.html"><svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.300" stroke-linecap="round"><path d="M2 7h28M2 16h28M2 25h28"/><circle cx="20" cy="7" r="2" fill="#d0702f"/><circle cx="9" cy="16" r="2" fill="#d0702f"/><circle cx="16" cy="25" r="2" fill="#d0702f"/></svg>Dashboard</a>
        <a href="calendar.html" aria-current="page"><svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.300"><rect x="3" y="6" width="23" height="21" rx="4"/><path d="M3 13h23M10 3v6M19 3v6M9 18h2M15 18h2M9 23h2"/><circle cx="25" cy="24" r="5.500" fill="#c35d27"/><path d="M22.800 24l1.700 1.700 3-3.200"/></svg>Bookings</a>
        <a href="mockup.html?p=24"><svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.300"><path d="M2 6h28M2 8.500h28M4 8.500V27M28 8.500V27M2 27h28M4 17h24M8 17v10M14 17v10M18 17v10M24 17v10"/><path d="M12 17v-3a4 4 0 0 1 8 0v3"/></svg>Function spaces</a>
        <a href="#"><svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.300"><circle cx="16" cy="16" r="5"/><path d="M14 3h4l.800 3.800 2.600 1.100 3.300-2.100 2.800 2.800-2.100 3.300 1.100 2.600L30 14v4l-3.500.800-1.100 2.600 2.100 3.300-2.800 2.800-3.300-2.100-2.600 1.100L18 29h-4l-.800-3.500-2.600-1.100-3.300 2.100-2.800-2.800 2.100-3.300-1.100-2.600L2 18v-4l3.500-.800 1.100-2.600-2.100-3.300 2.800-2.800 3.300 2.100 2.600-1.100z"/></svg>Settings</a>
        <a href="#"><svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.300" stroke-linecap="round"><path d="M16 4c7 0 12 4.800 12 11s-5 11-12 11c-1.700 0-3.300-.3-4.800-.8L5 27l1.900-5.100C5 19.900 4 17.600 4 15 4 8.800 9 4 16 4z"/><path d="M11 12h10M11 16h10M11 20h7"/></svg>FAQ’s</a>
      </nav>
    </div>
  </aside>

  <main class="cal-main">
    <div class="cal-top">
      <span class="cal-crumb"><span id="cal-crumb"></span><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div class="cal-tools">
        <button type="button" class="cal-icon" aria-label="Messages"><svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.300" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l19-3 2 13-13 2-5 4 .5-3.500L5 17.800z"/><path d="M7.500 8.500l11-1.700M8 12l11-1.700"/><path d="M26 12l3 1 1 11-2.500.500.500 4-4.500-3.500-8 .500-1-3"/></svg></button>
        <button type="button" class="cal-icon cal-avatar" id="cal-avatar"></button>
      </div>
    </div>
    <div class="cal-body">
      <h1>Booking calendar</h1>
      <div class="cal-controls">
        <label class="sr-only" for="cal-filter">Function space</label>
        <select class="cal-select" id="cal-filter"></select>
        <button type="button" class="cal-add" id="cal-add" aria-haspopup="dialog">Add booking</button>
      </div>
      <div class="cal-tabs" role="group" aria-label="Sort bookings">
        <button type="button" data-view="date">By date</button>
        <button type="button" data-view="space">By space</button>
      </div>
      <div class="cal-board">
        <button type="button" class="cal-arrow" id="cal-prev" aria-label="Previous columns"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="cal-columns" id="cal-columns"></div>
        <button type="button" class="cal-arrow" id="cal-next" aria-label="Next columns"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M2 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </main>
</div>

<dialog class="bk-box" id="bk-box" aria-labelledby="bk-heading">
  <form id="bk-form" novalidate>
    <h2 id="bk-heading">Edit Booking</h2>
    <div class="bk-grid">
      <div class="bk-details">
        <div id="bk-fields"></div>
      </div>
      <section class="bk-check" aria-labelledby="bk-check-title">
        <div class="bk-check-head">
          <h3 id="bk-check-title">Customer checklist</h3>
          <p class="bk-check-sum" id="bk-check-sum"></p>
        </div>
        <p class="bk-lead" id="bk-lead"></p>
        <ol class="bk-steps" id="bk-steps"></ol>
      </section>
      <div class="bk-actions">
        <button type="submit" class="bk-save" id="bk-save">Save Changes</button>
        <button type="button" class="bk-cancel" id="bk-cancel">Cancel Function</button>
        <p class="bk-cancel-note" id="bk-cancel-note" role="status"></p>
      </div>
    </div>
    <button type="button" class="bk-close" id="bk-close" aria-label="Close">&times;</button>
  </form>
</dialog>
<p class="cal-toast" id="cal-toast" role="status" hidden></p>

<script src="shared.js"></script>
<script src="data.js"></script>
<script src="calendar-data.js"></script>
<script src="calendar.js"></script>
</body>
</html>
